services:
  db:
    image: postgres:18.6@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - ontology-map-postgres:/var/lib/postgresql

  api:
    build: ./server
    environment:
      ONTOLOGY_MAP_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      ONTOLOGY_MAP_ENVIRONMENT: ${ONTOLOGY_MAP_ENVIRONMENT}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  ontology-map-postgres:
