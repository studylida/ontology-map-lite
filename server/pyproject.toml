[project]
name = "ontology-map-server"
version = "0.1.0"
requires-python = "==3.14.7"
dependencies = [
    "alembic==1.19.1",
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "langchain-core==1.6.2",
    "langchain-openai==1.6.2",
    "langsmith==0.12.4",
    "psycopg[binary]==3.3.4",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "pypdf==6.1.3",
    "python-docx==1.2.0",
    "python-multipart==0.0.20",
    "sqlalchemy==2.0.52",
    "uvicorn==0.52.4",
]

[dependency-groups]
dev = [
    "mypy==2.3.1",
    "pytest==9.1.1",
    "ruff==0.16.5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["B", "C90", "E", "F", "I"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["C901", "E501"]

[tool.mypy]
python_version = "3.14"
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
strict_equality = true
