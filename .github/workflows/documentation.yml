name: Documentation

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: 문서 계약 검사
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 저장소 받기
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: uv 준비
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.7"
          enable-cache: true
      - name: 생성 문서·링크·ADR 검사
        run: uv run --project server --frozen python scripts/check_docs.py --check
