name: NUMBER Attribute Migration Rehearsal

on:
  pull_request:
    paths:
      - ".github/workflows/attribute-unit-migration.yml"
      - "compose.yaml"
      - "server/alembic.ini"
      - "server/migrations/**"
      - "server/src/ontology_map/settings.py"
      - "server/tests/test_attribute_unit_migration_postgres.py"

permissions:
  contents: read

jobs:
  rehearsal:
    name: "#200 격리 PostgreSQL migration 왕복·fail-closed"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      COMPOSE_PROJECT_NAME: issue200-migration-${{ github.run_id }}-${{ github.run_attempt }}
      POSTGRES_DB: ontology_map_issue200_migration_rehearsal
      POSTGRES_USER: issue200_migration
      POSTGRES_PORT: "127.0.0.1:55434"
      ONTOLOGY_MAP_ENVIRONMENT: development
      ONTOLOGY_MAP_MIGRATION_REHEARSAL: "1"
      PYTHONPATH: ${{ github.workspace }}/server/src
    steps:
      - name: 저장소 받기
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: uv 준비
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.7"
          enable-cache: true
      - name: 고정 Python 환경 준비
        run: |
          uv sync --project server --frozen
          uv run --project server --frozen python --version
          uv run --project server --frozen pytest --version
      - name: 격리 DB credential 준비
        run: |
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          url="postgresql+psycopg://${POSTGRES_USER}:${password}@127.0.0.1:55434/${POSTGRES_DB}"
          echo "::add-mask::$url"
          {
            echo "POSTGRES_PASSWORD=$password"
            echo "ONTOLOGY_MAP_DATABASE_URL=$url"
          } >> "$GITHUB_ENV"
      - name: "#200 migration rehearsal 전용 PostgreSQL 시작"
        run: |
          docker compose version
          docker compose up --wait --wait-timeout 120 db
          docker compose exec -T db psql \
            -U "$POSTGRES_USER" \
            -d "$POSTGRES_DB" \
            -c 'SELECT version(), current_database();'
      - name: 0002 ↔ 0003 migration rehearsal
        run: |
          uv run --project server --frozen pytest -q \
            server/tests/test_attribute_unit_migration_postgres.py
      - name: 이번 run의 rehearsal DB 정리
        if: ${{ always() }}
        run: docker compose down --volumes
