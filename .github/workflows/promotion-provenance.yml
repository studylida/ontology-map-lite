name: Promotion Provenance

on:
  pull_request:
    paths:
      - ".github/workflows/promotion-provenance.yml"
      - "compose.yaml"
      - "server/**"
      - "scripts/check_docs.py"
      - "docs/**"

permissions:
  contents: read

jobs:
  check:
    name: "#216 PostgreSQL provenance regression"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: promotion216-${{ github.run_id }}-${{ github.run_attempt }}
      POSTGRES_DB: ontology_map_promotion216_test
      POSTGRES_USER: promotion216_test
      POSTGRES_PORT: "127.0.0.1:55433"
      ONTOLOGY_MAP_ENVIRONMENT: development
      PYTHONPATH: ${{ github.workspace }}/server/src
    steps:
      - name: 저장소 받기
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: uv 준비
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.7"
          enable-cache: true
      - name: 고정 환경 확인
        run: |
          git rev-parse HEAD
          uv --version
          uv sync --project server --frozen
          uv run --project server --frozen python --version
          uv run --project server --frozen pytest --version
      - name: 격리 DB credential 준비
        run: |
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          url="postgresql+psycopg://${POSTGRES_USER}:${password}@127.0.0.1:55433/${POSTGRES_DB}"
          echo "::add-mask::$url"
          {
            echo "POSTGRES_PASSWORD=$password"
            echo "ONTOLOGY_MAP_DATABASE_URL=$url"
            echo "ONTOLOGY_MAP_PROMOTION_PROVENANCE_TEST_DATABASE_URL=$url"
          } >> "$GITHUB_ENV"
      - name: PostgreSQL 18.6 격리 DB 시작
        run: |
          docker compose version
          docker compose up --wait --wait-timeout 120 db
          docker compose exec -T db psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c 'SELECT version(), current_database();'
      - name: 0004→0005 no-backfill migration rehearsal
        env:
          ONTOLOGY_MAP_PROMOTION_PROVENANCE_MIGRATION_REHEARSAL: "1"
        run: uv run --project server --frozen pytest server/tests/test_promotion_provenance_migration_postgres.py
      - name: migration head 적용
        working-directory: server
        run: |
          uv run --frozen alembic upgrade head
          uv run --frozen alembic current
      - name: PostgreSQL provenance 회귀
        run: uv run --project server --frozen pytest server/tests/test_promotion_provenance_postgres.py
      - name: 관련 unit 회귀
        run: uv run --project server --frozen pytest server/tests/test_entity_resolution.py
      - name: Backend format
        if: ${{ !cancelled() }}
        run: uv run --project server --frozen ruff format --check server
      - name: Backend Ruff
        if: ${{ !cancelled() }}
        run: uv run --project server --frozen ruff check server
      - name: Backend mypy
        if: ${{ !cancelled() }}
        working-directory: server
        run: uv run --frozen mypy src
      - name: Migration·metadata 일치 검사
        if: ${{ !cancelled() }}
        working-directory: server
        run: uv run --frozen alembic check
      - name: generated schema-reference 재생성
        if: ${{ !cancelled() }}
        run: uv run --project server --frozen python scripts/check_docs.py --write
      - name: generated schema-reference artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: issue-216-schema-reference
          path: docs/data/schema-reference.md
          if-no-files-found: error
      - name: generated schema-reference commit 확인
        if: ${{ !cancelled() }}
        run: git diff --exit-code -- docs/data/schema-reference.md
      - name: 문서 계약 검사
        if: ${{ !cancelled() }}
        run: uv run --project server --frozen python scripts/check_docs.py --check
      - name: diff 검사
        if: ${{ !cancelled() }}
        run: git diff HEAD^ HEAD --check
      - name: 격리 DB 정리
        if: ${{ always() }}
        run: docker compose down --volumes
